  <circle cx="46" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="21" r="6" fill="#4ade80"/>
  <text class="bar" x="480" y="25">rag-titan — terminal</text>
  <text class="t l0" x="44" y="90" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>rag-titan evaluate --input missed-evidence.json --output missed-report.json --k 3</text>
<g clip-path="url(#screen)"><rect class="cover c0" x="60.9" y="73" width="696" height="24" fill="#0f172a"/></g>
  <text class="t l1" x="44" y="114" fill="#94a3b8">Reports saved: missed-report.json and missed-report.md</text>
  <text class="t l2" x="44" y="138" fill="#fdba74">Overall score: 62.5/100 (Average)</text>
  <text class="t l3" x="44" y="162" fill="#94a3b8">Status: Action Required | Measurement coverage: 97%</text>
  <text class="t l4" x="44" y="186" fill="#fdba74">First failing stage: retrieval</text>
  <text class="t l5" x="44" y="224" fill="#e2e8f0"><tspan fill="#f472b6">$ </tspan>python inspect_report.py missed-report.json</text>
<g clip-path="url(#screen)"><rect class="cover c5" x="60.9" y="207" width="375" height="24" fill="#0f172a"/></g>
  <text class="t l6" x="44" y="248" fill="#94a3b8">retrieval.recall_at_k: 0.5</text>
  <text class="t l7" x="44" y="272" fill="#94a3b8">retrieval.mrr_at_k: 0.5</text>
  <text class="t l8" x="44" y="296" fill="#94a3b8">augmentation.context_sufficient: 0.5</text>
  <text class="t l9" x="44" y="320" fill="#94a3b8">generation.answer_f1: 0.5</text>
  <text class="t l10" x="44" y="344" fill="#94a3b8">generation.citation_precision: 1.0</text>
  <text class="t l11" x="44" y="368" fill="#94a3b8">generation.unsupported_number_rate: 0.0</text>
  <text class="t l12" x="44" y="392" fill="#fdba74">First failing stage: retrieval</text>
  <text class="t l13" x="44" y="416" fill="#94a3b8">  retrieval: Try hybrid retrieval or query rewriting, or raise top-k.</text>
  <text class="t l14" x="44" y="440" fill="#94a3b8">  augmentation: Pack all the supporting evidence into the context, within the budget.</text>
  <text class="t l15" x="44" y="464" fill="#94a3b8">  generation: Compare the answers with the references: check the prompt and the LLM.</text>
