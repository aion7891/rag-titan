site_name: rag-titan
site_description: A Swiss Army knife for RAG, simple and beginner friendly.
site_url: https://aion7891.github.io/rag-titan
repo_url: https://github.com/aion7891/rag-titan
repo_name: aion7891/rag-titan

theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            show_source: true

markdown_extensions:
  - admonition
  - attr_list   # buttons: [text](link){ .md-button }
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - tables

# files of the cookbook starter kit that are not pages of the site
exclude_docs: |
  assets/cookbook/handbook.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Evaluation cookbook:
      - Start here: cookbook/index.md
      - Your first evaluation: cookbook/first-evaluation.md
      - Diagnose a bad answer: cookbook/diagnose.md
      - Catch regressions: cookbook/regressions.md
      - Evaluate another RAG: cookbook/any-rag.md
      - Evaluate a live pipeline: cookbook/live-pipeline.md
      - Build a golden set: cookbook/golden-set.md
  - RAG types: rag-types.md
  - Building blocks: building-blocks.md
  - Evaluating RAG: evaluation.md
  - Evaluating every stage: stage-evaluation.md
  - Evaluation metrics: evaluation-metrics.md
  - Chunking methods: chunking.md
  - Chunk playground: playground.md
  - RAG playground: rag-playground.md
  - Configuration: configuration.md
  - Command line: cli.md
  - Agents: agents.md
  - Extending rag-titan: extending.md
  - API reference:
      - RAGTitan and factory: api/core.md
      - RAG types: api/rag-types.md
      - Building blocks: api/building-blocks.md
  - Roadmap: roadmap.md

hooks:
  - hooks/cache_bust.py   # adds ?v=<version> to our CSS/JS so browsers get new copies
  - hooks/playground_bundle.py   # zips src/rag_titan into the site for the RAG playground

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/rag-flow.css
  - assets/stylesheets/cookbook.css

# chunking page: formulas (pymdownx.arithmatex + MathJax) and the chunk playground
extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/chunk-core.js
  - assets/javascripts/chunk-playground.js
  - assets/javascripts/rag-steps.js
  - assets/javascripts/rag-flow.js
  - assets/javascripts/rag-cards.js
  - assets/javascripts/rag-playground.js
  - assets/javascripts/cookbook-commands.js
  - assets/javascripts/cookbook-lab.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
